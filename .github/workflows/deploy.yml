name: Keep GitHub Pages Offline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  offline:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Create 404-only site
        run: |
          mkdir offline
          printf '%s\n' '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>404 Not Found</title></head><body><h1>404 Not Found</h1></body></html>' > offline/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload offline artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './offline'

      - name: Deploy offline site
        id: deployment
        uses: actions/deploy-pages@v4
